name: Setup tox test environments

on:
  workflow_call:
    inputs:
      ignore_envs:
        required: false
        type: string
        default: ""
    outputs:
      lint:
        description: JSON array of lint tox environments
        value: ${{ jobs.setup-tox-envs.outputs.lint }}
      test:
        description: JSON array of test tox environments
        value: ${{ jobs.setup-tox-envs.outputs.test }}

jobs:
  setup-tox-envs:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.envs.outputs.lint }}
      test: ${{ steps.envs.outputs.test }}
    steps:
      - name: checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup python
        uses: infrabits/ci-setup-python@e067cec0986e3da663d95e6de24833c60322547c # main
        with:
          install_dependencies: false
          install_test_dependencies: false
          install_tox: true

      - name: setup tox environments
        uses: infrabits/ci-setup-tox-envs@e334c14a5ddc8756a926c152b5e8cd97ed0aca24 # main
        id: envs
        with:
          ignore_envs: ${{ inputs.ignore_envs }}
