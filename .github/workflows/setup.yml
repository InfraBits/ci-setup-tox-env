name: Setup tox test environments

on:
  workflow_call:
    inputs:
      ignore_envs:
        required: false
        type: string
        default: ""
    outputs:
      lint:
        description: JSON array of lint tox environments
        value: ${{ jobs.setup-tox-envs.outputs.lint }}
      test:
        description: JSON array of test tox environments
        value: ${{ jobs.setup-tox-envs.outputs.test }}

jobs:
  setup-tox-envs:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.envs.outputs.lint }}
      test: ${{ steps.envs.outputs.test }}
    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup python
        uses: infrabits/ci-setup-python@0e5179ada84a3ca313f5da73afcc6d5836dab809 # v1.9.0
        with:
          install_dependencies: false
          install_test_dependencies: false
          install_tox: true

      - name: setup tox environments
        uses: infrabits/ci-setup-tox-envs@0cd25fb25787c04f19ffcbd98591c542baf4b8bc # v1.11.0
        id: envs
        with:
          ignore_envs: ${{ inputs.ignore_envs }}
